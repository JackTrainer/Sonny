[package]
name = "SONNY"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
# Async runtime for real-time thread management
tokio = { version = "1.0", features = ["full"] }

# Unified very-low-latency network protocol
zenoh = { version = "1.0" }

# Lightweight parser for ROS2 Bridge messages (simulated or standard formats)
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }

# RS-232/485 serial communication for industrial fieldbuses (Modbus RTU, CAN)
tokio-serial = { version = "5.4" }

# FFI to system libraries for thread affinity and real-time priority
# (sched_setaffinity, sched_setscheduler/SCHED_FIFO, setpriority)
libc = "0.2"

# Cross-platform pinning of threads to dedicated cores: the 100 Hz real-time
# control loop lives on Core 1, the Wasmtime runtime on Core 2.
core_affinity = "0.8"

# ---------------------------------------------------------------------------
# Build profiles
# ---------------------------------------------------------------------------
#
# Hard panic handling: immediate ABORT, no unwinding.
# By default, when Rust hits an unrecoverable error it "unwinds" the thread
# memory to try to recover: that takes time and leaves the robot in an
# undefined state for several milliseconds. In robotics a bug can surface
# while the motors are executing a motion: if the software tries to "heal"
# on its own it risks wild drive movements.
#
# With `panic = "abort"` the process shuts down instantly (~microseconds),
# peripherals are left in the hands of the mechanical brakes, and the Hardware
# Watchdog remains the only safety arbiter of motion.
[profile.release]
panic = "abort"
